<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto 5-Second Cloudinary Recorder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 500;
            color: #e4e4e4;
        }
        video {
            width: 100%;
            max-height: 320px;
            border-radius: 12px;
            background: #000;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: scaleX(-1); /* Mirror view ke liye */
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #startBtn {
            background-color: #2ecc71;
            color: white;
        }
        #startBtn:hover {
            background-color: #27ae60;
        }
        #stopBtn {
            background-color: #e74c3c;
            color: white;
        }
        #stopBtn:hover {
            background-color: #c0392b;
        }
        button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        #status {
            margin-top: 15px;
            font-size: 15px;
            min-height: 24px;
            color: #f1c40f;
        }
        #linksContainer {
            margin-top: 15px;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }
        a {
            color: #3498db;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Har 5 Sec Auto Cloud Recorder</h2>
        <video id="preview" autoplay muted playsinline></video>
        
        <div class="controls">
            <button id="startBtn" disabled>Start Recording</button>
            <button id="stopBtn" disabled>Stop Recording</button>
        </div>

        <p id="status">Permissions mangi ja rahi hain...</p>
        <div id="linksContainer"></div>
    </div>

    <script>
        let mediaRecorder;
        let stream;

        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const linksContainer = document.getElementById('linksContainer');

        // Aapki Cloudinary Details yahan configured hain
        const CLOUD_NAME = "zowk74pz";
        const API_KEY = "684481677341335";
        const UPLOAD_PRESET = "GrpVTqmhonJpsAJFm_YcY2wVnwM"; // Unsigned preset

        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;

        // 1. Page load hote hi Camera aur Mic ki permission lena
        async function initMedia() {
            try {
                status.innerText = "Kripya Camera aur Microphone ki permission dein...";
                
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                preview.srcObject = stream;
                
                status.innerText = "Permissions mil gayi! Ab aap 'Start Recording' daba sakte hain.";
                startBtn.disabled = false;

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

                // 2. Har 5 second baad yeh event trigger hoga aur chunk dega
                mediaRecorder.ondataavailable = async (event) => {
                    if (event.data && event.data.size > 0) {
                        const chunkBlob = new Blob([event.data], { type: 'video/webm' });
                        await uploadToCloudinary(chunkBlob);
                    }
                };

            } catch (err) {
                console.error("Permission error:", err);
                status.innerText = "Error: Camera ya Microphone ki permission nahi mili.";
            }
        }

        // 3. Start button click event
        startBtn.onclick = () => {
            // Yahan 5000 milliseconds (5 seconds) paas kiya gaya hai
            mediaRecorder.start(5000);
            startBtn.disabled = true;
            stopBtn.disabled = false;
            status.innerText = "🔴 Recording active: Har 5 seconds mein Cloudinary par save ho raha hai...";
        };

        // 4. Stop button click event
        stopBtn.onclick = () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            status.innerText = "⏹️ Recording rok di gayi hai.";
        };

        // 5. Cloudinary par file upload karne ka function
        async function uploadToCloudinary(blob) {
            const formData = new FormData();
            formData.append("file", blob);
            formData.append("upload_preset", UPLOAD_PRESET);
            // Agar zaroorat ho toh api_key bhi append ki ja sakti hai, par unsigned upload preset ke liye sirf preset kafi hota hai.

            try {
                const response = await fetch(CLOUDINARY_URL, {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                if (data.secure_url) {
                    const timeStr = new Date().toLocaleTimeString();
                    const link = document.createElement('a');
                    link.href = data.secure_url;
                    link.target = "_blank";
                    link.innerText = `[${timeStr}] 5-Sec Video Saved (Click to view)`;
                    linksContainer.prepend(link); // Naye links upar show honge
                } else {
                    console.error("Cloudinary Error:", data.error?.message);
                }
            } catch (err) {
                console.error("Network/Upload error:", err);
            }
        }

        // App start
        window.addEventListener('load', initMedia);
    </script>
</body>
</html>
