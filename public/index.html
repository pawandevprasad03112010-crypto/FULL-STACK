<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto 5-Second Cloudinary Recorder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 500;
            color: #e4e4e4;
        }
        video {
            width: 100%;
            max-height: 280px;
            border-radius: 12px;
            background: #000;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: scaleX(-1);
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #f1c40f;
            word-break: break-all;
        }
        #linksContainer {
            margin-top: 15px;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }
        a {
            color: #3498db;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Auto Cloud Recording (Live)</h2>
        <video id="preview" autoplay muted playsinline></video>
        
        <p id="status">Permissions mangi ja rahi hain...</p>
        <div id="linksContainer"></div>
    </div>

    <script>
        let mediaRecorder;
        let stream;

        const preview = document.getElementById('preview');
        const status = document.getElementById('status');
        const linksContainer = document.getElementById('linksContainer');

        const CLOUD_NAME = "zowk74pz";
        const UPLOAD_PRESET = "GrpVTqmhonJpsAJFm_YcY2wVnwM";
        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;

        async function initMedia() {
            try {
                status.innerText = "Kripya Camera aur Microphone ki permission dein...";
                
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                preview.srcObject = stream;
                
                status.innerText = "🔴 Recording chalu hai... Har 5 second mein upload ho raha hai.";

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

                mediaRecorder.ondataavailable = async (event) => {
                    if (event.data && event.data.size > 0) {
                        const chunkBlob = new Blob([event.data], { type: 'video/webm' });
                        await uploadToCloudinary(chunkBlob);
                    }
                };

                mediaRecorder.start(5000);

            } catch (err) {
                console.error("Permission error:", err);
                status.innerText = "Error: Camera ya Mic ki permission nahi mili.";
            }
        }

        async function uploadToCloudinary(blob) {
            const formData = new FormData();
            formData.append("file", blob);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                const response = await fetch(CLOUDINARY_URL, {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                if (data.secure_url) {
                    const timeStr = new Date().toLocaleTimeString();
                    const link = document.createElement('a');
                    link.href = data.secure_url;
                    link.target = "_blank";
                    link.innerText = `[${timeStr}] Saved! Click to view`;
                    linksContainer.prepend(link);
                } else {
                    console.error("Cloudinary Error:", data);
                    status.innerText = "Upload Failed: " + (data.error?.message || "Invalid Preset/Cloud Name");
                }
            } catch (err) {
                console.error("Network error:", err);
                status.innerText = "Network Error: Upload nahi ho saka.";
            }
        }

        window.addEventListener('load', initMedia);
    </script>
</body>
</html>
